<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>翻滚多面体 · 障碍模拟</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header id="hud">
      <h1>小斜方立方八面体 · 翻滚障碍模拟</h1>
      <div id="stats">
        <div class="stat"><span class="label">前进格数</span><span id="stat-distance" class="value">0</span></div>
        <div class="stat"><span class="label">躲避次数</span><span id="stat-dodges" class="value">0</span></div>
      </div>
    </header>

    <div id="controls">
      <button id="btn-toggle" type="button">暂停</button>
      <button id="btn-reset" type="button">重置</button>
      <label id="speed-label">
        速度
        <select id="speed">
          <option value="slow">慢</option>
          <option value="normal" selected>正常</option>
          <option value="fast">快</option>
        </select>
      </label>
    </div>

    <p id="legend">
      规则：形体沿直线连续翻滚前进，每走一步翻两下，落地必定是正方形朝下；
      遇到前方障碍时，会先向左或向右翻滚一次（两下）避开，再继续向前。<br />
      操作：拖动鼠标绕形体旋转视角、滚轮缩放距离（相机高度固定）；
      方向键 / WASD 可手动前进或左右翻滚，同样是翻两下。
    </p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
